AWSTemplateFormatVersion: "2010-09-09"
Description: invoice-ap artifacts. One private bucket that holds packaged Lambda code for the reader stack.

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub invoice-ap-artifacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # Lambda copies the code when a function is created or updated, so
          # an old package is not needed once its deploy has finished.
          - Id: expire-old-packages
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: invoice-ap

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
